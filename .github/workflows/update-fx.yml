name: 환율 갱신

# ★ 이 워크플로가 하는 일 ★
# ECB 기준환율을 받아 fx/<통화>.json 으로 저장소에 커밋한다.
# 앱은 이 파일을 raw.githubusercontent 에서 읽으므로 외부 API에 직접 접근하지 않는다.
#
# ⚠️ GitHub Actions는 서버가 아니다. 요청에 응답할 수 없다.
#    "미리 만들어 정적 파일로 올려두는" 방식만 가능하다.
#    실시간 데이터가 필요하면 Cloudflare Workers 같은 것이 필요하다.
#    다만 ECB는 영업일 1회 고시라 이 방식으로 충분하다.

on:
  schedule:
    # ECB는 중앙유럽시간 16:00경 고시한다. 여유를 두고 UTC 16:30에 실행.
    # ⚠️ GitHub의 cron은 부하에 따라 수 분~수십 분 지연될 수 있다.
    #    정확한 시각이 필요한 작업에는 쓰지 말 것.
    - cron: "30 16 * * *"
  # 수동 실행. 테스트하거나 급히 갱신할 때 쓴다.
  workflow_dispatch:

# ⚠️ 저장소에 커밋하려면 쓰기 권한이 필요하다.
#    기본값은 읽기 전용이라 이 선언이 없으면 push 단계에서 실패한다.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 환율 수집
        run: python3 scripts/fetch_fx.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx/

          # ⚠️ 변경이 없으면 커밋하지 않는다.
          #    주말·공휴일에는 ECB 고시가 없어 값이 그대로인데,
          #    매일 빈 커밋을 쌓으면 히스토리가 지저분해진다.
          if git diff --staged --quiet; then
            echo "변경 없음 (주말·공휴일이거나 고시 전)"
            exit 0
          fi

          # [skip ci]로 검증 워크플로가 다시 돌지 않게 한다
          git commit -m "chore: 환율 갱신 $(date -u +%Y-%m-%d) [skip ci]"
          git push
