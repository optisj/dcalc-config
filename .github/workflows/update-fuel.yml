name: 유가 갱신

# ★ 이 워크플로가 하는 일 ★
# 오피넷(한국석유공사) 평균 유가를 받아 fuel/latest.json 으로 커밋한다.
#
# ★ Actions로 받는 이유 ★
#  1) API 키를 앱에 넣지 않아도 된다.
#     앱에 박으면 APK를 뜯어 꺼낼 수 있다. 여기서는 Secrets에 둔다.
#  2) 오피넷 API는 http(평문)다. 앱이 직접 호출하려면
#     cleartextTrafficPermitted 예외를 열어야 하는데 보안 점검 지적 항목이다.
#     Actions가 받아오면 앱은 https만 쓴다.
#  3) 사용자 수와 무관하게 API 호출이 하루 24회로 고정된다.
#
# ⚠️ OPINET_API_KEY Secret이 없으면 스크립트가 조용히 건너뛴다.
#    키 발급 전에도 워크플로가 실패하지 않는다.

on:
  schedule:
    # 매시 정각. 오피넷 평균가는 하루 단위로 바뀌지만,
    # 갱신 시각이 고정돼 있지 않아 자주 확인하는 편이 낫다.
    # 변경이 없으면 커밋하지 않으므로 히스토리가 더러워지지 않는다.
    #
    # ⚠️ GitHub cron은 부하에 따라 지연되거나 건너뛸 수 있다.
    #    정확한 시각 보장이 필요하면 이 방식은 맞지 않다.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 유가 수집
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 등록
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: python3 scripts/fetch_fuel.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 키가 없으면 fuel 디렉토리 자체가 없다
          [ -d fuel ] || { echo "수집된 데이터 없음"; exit 0; }

          git add fuel/

          # ⚠️ _fetchedAt 은 매시간 바뀌므로 그것만 달라졌으면 커밋하지 않는다.
          #    안 그러면 가격이 그대로인데도 하루 24개 커밋이 쌓인다.
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi

          # 가격이 실제로 바뀌었는지 확인
          if git diff --staged -- fuel/ | grep -E '^[+-]' | grep -vE '^[+-]{3}' \
             | grep -vq '_fetchedAt'; then
            git commit -m "chore: 유가 갱신 $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            git push
          else
            echo "조회 시각만 변경됨 — 커밋 생략"
            git restore --staged fuel/
            git checkout -- fuel/
          fi
